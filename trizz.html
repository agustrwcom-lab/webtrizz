<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a1a">
    <title>TriX - Snake & Tic Tac Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0d0d2b 100%);
            color: #fff;
            overflow: hidden;
            touch-action: manipulation;
            height: 100vh;
            width: 100vw;
        }

        /* Partículas de fondo */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(100, 200, 255, 0.6);
            border-radius: 50%;
            animation: float 15s infinite;
            box-shadow: 0 0 10px rgba(100, 200, 255, 0.8);
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
        }

        /* Pantallas */
        .screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .screen.active {
            display: flex;
        }

        /* Logo y título */
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(45deg, #00d4ff, #ff00ff, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            animation: glow 2s ease-in-out infinite alternate;
            letter-spacing: 5px;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.8)); }
            to { filter: drop-shadow(0 0 40px rgba(255, 0, 255, 0.8)); }
        }

        .subtitle {
            font-size: 1.1rem;
            color: #a0a0c0;
            margin-top: 10px;
            letter-spacing: 3px;
        }

        /* Botones */
        .btn {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(138, 43, 226, 0.2));
            border: 2px solid rgba(0, 212, 255, 0.5);
            color: #fff;
            padding: 18px 40px;
            font-size: 1.2rem;
            border-radius: 15px;
            cursor: pointer;
            margin: 10px;
            width: 280px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .btn:hover, .btn:active {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
            border-color: #00d4ff;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.3), rgba(138, 43, 226, 0.3));
        }

        .btn-gold {
            border-color: rgba(255, 215, 0, 0.5);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 140, 0, 0.2));
        }

        .btn-gold:hover, .btn-gold:active {
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.4);
            border-color: #ffd700;
        }

        .btn-pink {
            border-color: rgba(255, 105, 180, 0.5);
            background: linear-gradient(135deg, rgba(255, 105, 180, 0.2), rgba(255, 20, 147, 0.2));
        }

        .btn-pink:hover, .btn-pink:active {
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.4);
            border-color: #ff69b4;
        }

        .btn-small {
            padding: 12px 25px;
            font-size: 1rem;
            width: auto;
            min-width: 120px;
        }

        .btn-icon {
            font-size: 1.5rem;
            margin-right: 10px;
        }

        /* Header de juego */
        .game-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .back-btn {
            background: none;
            border: none;
            color: #00d4ff;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px 15px;
        }

        .score-display {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .level-display {
            font-size: 1rem;
            color: #ff69b4;
        }

        /* Canvas */
        canvas {
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
            background: rgba(10, 10, 30, 0.8);
        }

        /* Controles táctiles */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 70px);
            gap: 5px;
            z-index: 100;
        }

        .control-btn {
            background: rgba(0, 212, 255, 0.2);
            border: 2px solid rgba(0, 212, 255, 0.4);
            border-radius: 15px;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }

        .control-btn:active {
            background: rgba(0, 212, 255, 0.5);
            transform: scale(0.95);
        }

        .control-btn:nth-child(2) { grid-column: 2; grid-row: 1; }
        .control-btn:nth-child(4) { grid-column: 1; grid-row: 2; }
        .control-btn:nth-child(5) { grid-column: 3; grid-row: 2; }
        .control-btn:nth-child(3) { grid-column: 2; grid-row: 3; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a0a2e, #0d0d2b);
            border: 2px solid rgba(0, 212, 255, 0.5);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 350px;
            width: 90%;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.3);
        }

        .modal-title {
            font-size: 2rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #00d4ff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-text {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #c0c0e0;
        }

        /* Grid de niveles */
        .levels-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 20px 0;
            max-width: 350px;
        }

        .level-btn {
            aspect-ratio: 1;
            border-radius: 15px;
            border: 2px solid rgba(0, 212, 255, 0.3);
            background: rgba(0, 212, 255, 0.1);
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .level-btn.locked {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .level-btn.completed {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.2);
        }

        .level-btn.current {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.8); }
        }

        .stars {
            font-size: 0.7rem;
            margin-top: 5px;
        }

        /* Tablero Tic Tac Toe */
        .ttt-board {
            display: grid;
            gap: 8px;
            margin: 20px auto;
        }

        .ttt-cell {
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            aspect-ratio: 1;
        }

        .ttt-cell:hover {
            background: rgba(0, 212, 255, 0.2);
            transform: scale(1.05);
        }

        .ttt-cell.x {
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
        }

        .ttt-cell.o {
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
        }

        .ttt-cell.winner {
            background: rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
            animation: winnerPulse 0.5s ease-in-out infinite alternate;
        }

        @keyframes winnerPulse {
            from { box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
            to { box-shadow: 0 0 30px rgba(255, 215, 0, 0.9); }
        }

        /* Skins */
        .skins-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .skin-item {
            aspect-ratio: 1;
            border-radius: 15px;
            border: 2px solid rgba(0, 212, 255, 0.3);
            background: rgba(0, 212, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            padding: 10px;
        }

        .skin-item.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        .skin-item.locked {
            opacity: 0.4;
        }

        .skin-preview {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-bottom: 5px;
        }

        .skin-name {
            font-size: 0.8rem;
            text-align: center;
        }

        /* Settings */
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 300px;
        }

        .toggle {
            width: 50px;
            height: 26px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 13px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle.active {
            background: #00d4ff;
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: all 0.3s;
        }

        .toggle.active::after {
            left: 26px;
        }

        /* Animaciones */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Responsive */
        @media (max-width: 400px) {
            .logo { font-size: 3rem; }
            .btn { width: 240px; padding: 15px 30px; font-size: 1rem; }
            .levels-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
<base target="_blank">

<body>
    <!-- Partículas de fondo -->
    <div class="particles" id="particles"></div>

    <!-- Pantalla de Inicio -->
    <div class="screen active" id="menuScreen">
        <div class="logo-container fade-in">
            <div class="logo">TriX</div>
            <div class="subtitle">SNAKE × TIC TAC TOE</div>
        </div>
        <div class="fade-in" style="animation-delay: 0.2s">
            <button class="btn" onclick="showScreen('snakeMenuScreen')">
                <span class="btn-icon">🐍</span>Modo Serpiente
            </button>
            <button class="btn btn-pink" onclick="showScreen('tttMenuScreen')">
                <span class="btn-icon">⭕</span>Modo 3 en Raya
            </button>
            <button class="btn btn-gold" onclick="showScreen('skinsScreen')">
                <span class="btn-icon">🎨</span>Skins & Temas
            </button>
            <button class="btn" onclick="showScreen('settingsScreen')">
                <span class="btn-icon">⚙️</span>Configuración
            </button>
        </div>
    </div>

    <!-- Menú Snake -->
    <div class="screen" id="snakeMenuScreen">
        <div class="logo-container">
            <div class="logo" style="font-size: 2.5rem">🐍 Snake</div>
        </div>
        <button class="btn" onclick="startSnakeGame()">Jugar</button>
        <button class="btn" onclick="showScreen('levelsScreen')">Niveles</button>
        <button class="btn btn-small" onclick="showScreen('menuScreen')">⬅ Volver</button>
    </div>

    <!-- Menú Tic Tac Toe -->
    <div class="screen" id="tttMenuScreen">
        <div class="logo-container">
            <div class="logo" style="font-size: 2.5rem">⭕ 3 en Raya</div>
        </div>
        <button class="btn" onclick="startTTTGame('pvp')">👤 vs 👤 2 Jugadores</button>
        <button class="btn btn-pink" onclick="startTTTGame('ai')">👤 vs 🤖 vs IA</button>
        <button class="btn" onclick="showScreen('tttLevelsScreen')">Niveles</button>
        <button class="btn btn-small" onclick="showScreen('menuScreen')">⬅ Volver</button>
    </div>

    <!-- Pantalla de Niveles Snake -->
    <div class="screen" id="levelsScreen">
        <div class="logo-container">
            <div style="font-size: 1.8rem; color: #00d4ff; margin-bottom: 10px">Selecciona Nivel</div>
        </div>
        <div class="levels-grid" id="snakeLevelsGrid"></div>
        <button class="btn btn-small" onclick="showScreen('snakeMenuScreen')">⬅ Volver</button>
    </div>

    <!-- Pantalla de Niveles TTT -->
    <div class="screen" id="tttLevelsScreen">
        <div class="logo-container">
            <div style="font-size: 1.8rem; color: #ff69b4; margin-bottom: 10px">Tableros</div>
        </div>
        <div class="levels-grid" id="tttLevelsGrid"></div>
        <button class="btn btn-small" onclick="showScreen('tttMenuScreen')">⬅ Volver</button>
    </div>

    <!-- Pantalla de Skins -->
    <div class="screen" id="skinsScreen">
        <div class="logo-container">
            <div style="font-size: 1.8rem; color: #ffd700; margin-bottom: 10px">Skins & Temas</div>
        </div>
        <div style="margin-bottom: 15px; color: #a0a0c0">Puntos: <span id="skinPoints" style="color: #ffd700; font-weight: bold">0</span></div>
        <div class="skins-grid" id="skinsGrid"></div>
        <button class="btn btn-small" onclick="showScreen('menuScreen')">⬅ Volver</button>
    </div>

    <!-- Configuración -->
    <div class="screen" id="settingsScreen">
        <div class="logo-container">
            <div style="font-size: 1.8rem; color: #00d4ff; margin-bottom: 10px">Configuración</div>
        </div>
        <div class="setting-item">
            <span>🎵 Música</span>
            <div class="toggle active" id="musicToggle" onclick="toggleSetting('music')"></div>
        </div>
        <div class="setting-item">
            <span>🔊 Efectos de sonido</span>
            <div class="toggle active" id="sfxToggle" onclick="toggleSetting('sfx')"></div>
        </div>
        <div class="setting-item">
            <span>✨ Efectos visuales</span>
            <div class="toggle active" id="vfxToggle" onclick="toggleSetting('vfx')"></div>
        </div>
        <div class="setting-item">
            <span>📳 Vibración</span>
            <div class="toggle" id="vibrationToggle" onclick="toggleSetting('vibration')"></div>
        </div>
        <div style="margin-top: 20px; text-align: center">
            <button class="btn btn-small" onclick="resetProgress()" style="background: rgba(255,0,0,0.2); border-color: rgba(255,0,0,0.5)">🗑️ Reiniciar Progreso</button>
        </div>
        <button class="btn btn-small" onclick="showScreen('menuScreen')" style="margin-top: 20px">⬅ Volver</button>
    </div>

    <!-- Juego Snake -->
    <div class="screen" id="snakeGameScreen">
        <div class="game-header">
            <button class="back-btn" onclick="pauseSnake()">⏸️</button>
            <div>
                <div class="score-display">⭐ <span id="snakeScore">0</span></div>
                <div class="level-display">Nivel <span id="snakeLevel">1</span></div>
            </div>
            <div style="width: 40px"></div>
        </div>
        <canvas id="snakeCanvas" style="margin-top: 60px"></canvas>
        <div class="controls" id="snakeControls">
            <button class="control-btn" onclick="changeDirection('up')">▲</button>
            <button class="control-btn" onclick="changeDirection('left')">◀</button>
            <button class="control-btn" onclick="changeDirection('right')">▶</button>
            <button class="control-btn" onclick="changeDirection('down')">▼</button>
        </div>
    </div>

    <!-- Juego Tic Tac Toe -->
    <div class="screen" id="tttGameScreen">
        <div class="game-header">
            <button class="back-btn" onclick="showScreen('tttMenuScreen')">⬅️</button>
            <div>
                <div class="score-display" id="tttStatus">Tu turno</div>
                <div class="level-display">Tablero <span id="tttBoardSize">3×3</span></div>
            </div>
            <div style="width: 40px"></div>
        </div>
        <div style="margin-top: 80px; text-align: center">
            <div style="display: flex; justify-content: center; gap: 30px; margin-bottom: 15px">
                <div style="color: #00d4ff">❌: <span id="scoreX">0</span></div>
                <div style="color: #a0a0c0">Empates: <span id="scoreDraw">0</span></div>
                <div style="color: #ff69b4">⭕: <span id="scoreO">0</span></div>
            </div>
            <div class="ttt-board" id="tttBoard"></div>
        </div>
        <div style="margin-top: 20px">
            <button class="btn btn-small" onclick="resetTTT()">🔄 Reiniciar</button>
            <button class="btn btn-small" onclick="showScreen('tttMenuScreen')">🏠 Menú</button>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">¡Victoria!</div>
            <div class="modal-text" id="modalText">Has completado el nivel</div>
            <button class="btn" id="modalBtn" onclick="closeModal()">Continuar</button>
        </div>
    </div>

    <script>
        // ==================== SISTEMA DE AUDIO ====================
        const AudioSys = {
            ctx: null,
            musicEnabled: true,
            sfxEnabled: true,

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            },

            playTone(freq, duration, type = 'sine', volume = 0.3) {
                if (!this.sfxEnabled || !this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(volume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                osc.start(this.ctx.currentTime);
                osc.stop(this.ctx.currentTime + duration);
            },

            playEat() {
                this.playTone(523, 0.1, 'sine', 0.2);
                setTimeout(() => this.playTone(659, 0.1, 'sine', 0.2), 50);
                setTimeout(() => this.playTone(784, 0.15, 'sine', 0.2), 100);
            },

            playMove() {
                this.playTone(440, 0.05, 'sine', 0.1);
            },

            playWin() {
                [523, 659, 784, 1047].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 0.2, 'sine', 0.3), i * 100);
                });
            },

            playLose() {
                [400, 350, 300, 200].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 0.3, 'sawtooth', 0.2), i * 150);
                });
            },

            playClick() {
                this.playTone(800, 0.05, 'sine', 0.1);
            }
        };

        // ==================== SISTEMA DE DATOS ====================
        const GameData = {
            data: {
                points: 0,
                snakeLevel: 1,
                snakeLevelsCompleted: [],
                tttLevel: 1,
                tttLevelsCompleted: [],
                currentSkin: 'neon',
                unlockedSkins: ['neon'],
                settings: {
                    music: true,
                    sfx: true,
                    vfx: true,
                    vibration: false
                },
                tttStats: { x: 0, o: 0, draw: 0 }
            },

            load() {
                const saved = localStorage.getItem('trix_data');
                if (saved) {
                    this.data = { ...this.data, ...JSON.parse(saved) };
                }
            },

            save() {
                localStorage.setItem('trix_data', JSON.stringify(this.data));
            },

            addPoints(p) {
                this.data.points += p;
                this.save();
                updateSkinPoints();
            }
        };

        // ==================== SKINS ====================
        const SKINS = {
            neon: { name: 'Neón', color: '#00ff88', head: '#00d4ff', body: '#00ff88', locked: false, cost: 0 },
            fire: { name: 'Fuego', color: '#ff6b6b', head: '#ff4500', body: '#ff6b6b', locked: true, cost: 100 },
            ice: { name: 'Hielo', color: '#87ceeb', head: '#00bfff', body: '#87ceeb', locked: true, cost: 100 },

        // ==================== SNAKE GAME ====================
        let snakeGame = null;
        let snakeCanvas, snakeCtx;

        function startSnakeGame() {
            AudioSys.init();
            AudioSys.playClick();
            showScreen('snakeGameScreen');

            snakeCanvas = document.getElementById('snakeCanvas');
            snakeCtx = snakeCanvas.getContext('2d');

            const level = SNAKE_LEVELS[GameData.data.snakeLevel - 1];
            const size = Math.min(window.innerWidth - 40, 400);
            const cellSize = Math.floor(size / level.size);

            snakeCanvas.width = cellSize * level.size;
            snakeCanvas.height = cellSize * level.size;

            snakeGame = {
                snake: [{ x: Math.floor(level.size / 2), y: Math.floor(level.size / 2) }],
                direction: 'right',
                nextDirection: 'right',
                food: null,
                obstacles: [],
                score: 0,
                targets: level.targets,
                collected: 0,
                level: level,
                cellSize: cellSize,
                running: true,
                speed: level.speed
            };

            // Generar obstáculos
            for (let i = 0; i < level.obstacles; i++) {
                let obs;
                do {
                    obs = {
                        x: Math.floor(Math.random() * level.size),
                        y: Math.floor(Math.random() * level.size)
                    };
                } while (
                    (obs.x === snakeGame.snake[0].x && obs.y === snakeGame.snake[0].y) ||
                    snakeGame.obstacles.some(o => o.x === obs.x && o.y === obs.y)
                );
                snakeGame.obstacles.push(obs);
            }

            spawnFood();
            document.getElementById('snakeScore').textContent = '0';
            document.getElementById('snakeLevel').textContent = level.id;

            if (snakeAnimationId) clearInterval(snakeAnimationId);
            snakeAnimationId = setInterval(gameLoop, snakeGame.speed);

            // Controles de teclado
            document.onkeydown = handleSnakeKey;
        }

        function spawnFood() {
            const level = snakeGame.level;
            do {
                snakeGame.food = {
                    x: Math.floor(Math.random() * level.size),
                    y: Math.floor(Math.random() * level.size)
                };
            } while (
                snakeGame.snake.some(s => s.x === snakeGame.food.x && s.y === snakeGame.food.y) ||
                snakeGame.obstacles.some(o => o.x === snakeGame.food.x && o.y === snakeGame.food.y)
            );
        }

        function gameLoop() {
            if (!snakeGame || !snakeGame.running) return;

            const head = { ...snakeGame.snake[0] };
            snakeGame.direction = snakeGame.nextDirection;

            switch (snakeGame.direction) {
                case 'up': head.y--; break;
                case 'down': head.y++; break;
                case 'left': head.x--; break;
                case 'right': head.x++; break;
            }

            // Colisiones con paredes
            if (head.x < 0 || head.x >= snakeGame.level.size || head.y < 0 || head.y >= snakeGame.level.size) {
                gameOver();
                return;
            }

            // Colisión con sí misma
            if (snakeGame.snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            // Colisión con obstáculos
            if (snakeGame.obstacles.some(o => o.x === head.x && o.y === head.y)) {
                gameOver();
                return;
            }

            snakeGame.snake.unshift(head);

            // Comer comida
            if (head.x === snakeGame.food.x && head.y === snakeGame.food.y) {
                snakeGame.score += 10;
                snakeGame.collected++;
                document.getElementById('snakeScore').textContent = snakeGame.score;
                AudioSys.playEat();

                if (snakeGame.collected >= snakeGame.targets) {
                    levelComplete();
                    return;
                }
                spawnFood();
            } else {
                snakeGame.snake.pop();
            }

            drawSnake();
        }

        function drawSnake() {
            const ctx = snakeCtx;
            const cs = snakeGame.cellSize;
            const skin = SKINS[GameData.data.currentSkin];

            // Fondo
            ctx.fillStyle = 'rgba(10, 10, 30, 0.9)';
            ctx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);

            // Grid
            ctx.strokeStyle = 'rgba(0, 212, 255, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= snakeGame.level.size; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cs, 0);
                ctx.lineTo(i * cs, snakeCanvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * cs);
                ctx.lineTo(snakeCanvas.width, i * cs);
                ctx.stroke();
            }

            // Obstáculos
            ctx.fillStyle = 'rgba(255, 50, 50, 0.6)';
            snakeGame.obstacles.forEach(obs => {
                ctx.fillRect(obs.x * cs + 2, obs.y * cs + 2, cs - 4, cs - 4);
                ctx.shadowColor = '#ff3333';
                ctx.shadowBlur = 10;
                ctx.fillRect(obs.x * cs + 4, obs.y * cs + 4, cs - 8, cs - 8);
                ctx.shadowBlur = 0;
            });

            // Comida
            const fx = snakeGame.food.x * cs + cs / 2;
            const fy = snakeGame.food.y * cs + cs / 2;
            ctx.shadowColor = '#ffd700';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(fx, fy, cs / 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Serpiente
            snakeGame.snake.forEach((segment, i) => {
                const x = segment.x * cs + 2;
                const y = segment.y * cs + 2;
                const w = cs - 4;
                const h = cs - 4;

                if (i === 0) {
                    // Cabeza
                    ctx.shadowColor = skin.head;
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = skin.head;
                    ctx.beginPath();
                    ctx.roundRect(x, y, w, h, 8);
                    ctx.fill();

                    // Ojos
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(x + w * 0.3, y + h * 0.3, 3, 0, Math.PI * 2);
                    ctx.arc(x + w * 0.7, y + h * 0.3, 3, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Cuerpo
                    ctx.shadowColor = skin.body;
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = skin.body;
                    const alpha = 1 - (i / snakeGame.snake.length) * 0.5;
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.roundRect(x + 2, y + 2, w - 4, h - 4, 5);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
                ctx.shadowBlur = 0;
            });

            // Progreso
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = '12px Arial';
            ctx.fillText(`${snakeGame.collected}/${snakeGame.targets} 🍎`, 10, 20);
        }

        function changeDirection(dir) {
            if (!snakeGame || !snakeGame.running) return;
            const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
            if (opposites[dir] !== snakeGame.direction) {
                snakeGame.nextDirection = dir;
                AudioSys.playMove();

        function handleSnakeKey(e) {

            if (keys[e.key]) {

        function makeTTTMove(index) {
            if (!tttGame || tttGame.gameOver || tttGame.board[index]) return;

            AudioSys.playMove();
            tttGame.board[index] = tttGame.currentPlayer;
            renderTTTBoard();

            if (checkTTTWin()) {
                tttGame.gameOver = true;
                tttGame.winner = tttGame.currentPlayer;
                AudioSys.playWin();

                if (tttGame.currentPlayer === 'x') GameData.data.tttStats.x++;
                else GameData.data.tttStats.o++;
                GameData.data.tttStats.draw = GameData.data.tttStats.draw;
                GameData.save();

                const level = TTT_LEVELS[GameData.data.tttLevel - 1];
                if (!GameData.data.tttLevelsCompleted.includes(level.id)) {
                    GameData.data.tttLevelsCompleted.push(level.id);
                }
                if (level.id >= GameData.data.tttLevel) {
                    GameData.data.tttLevel = Math.min(level.id + 1, TTT_LEVELS.length);
                }
                GameData.addPoints(50);

                highlightWinningCells();

                setTimeout(() => {
                    showModal('🎉 ¡Victoria!', `${tttGame.winner === 'x' ? '❌' : '⭕'} ha ganado`, 'Nueva Partida', () => {
                        startTTTGame(tttGame.mode);
                    });
                }, 500);
                return;
            }

            if (tttGame.board.every(cell => cell !== null)) {
                tttGame.gameOver = true;
                GameData.data.tttStats.draw++;
                GameData.save();
                AudioSys.playLose();
                updateTTTStatus();

                setTimeout(() => {
                    showModal('🤝 Empate', 'Nadie ha ganado', 'Nueva Partida', () => {
                        startTTTGame(tttGame.mode);
                    });
                }, 500);
                return;
            }

            tttGame.currentPlayer = tttGame.currentPlayer === 'x' ? 'o' : 'x';
            updateTTTStatus();

            if (tttGame.mode === 'ai' && tttGame.currentPlayer === 'o' && !tttGame.gameOver) {
                setTimeout(makeAIMove, 500);
            }
        }

        function makeAIMove() {
            if (!tttGame || tttGame.gameOver) return;

            const size = tttGame.size;
            const board = tttGame.board;

            // IA simple: primero intenta ganar, luego bloquear, luego centro, luego esquinas, luego aleatorio
            function getWinningMove(player) {
                for (let i = 0; i < board.length; i++) {
                    if (!board[i]) {
                        board[i] = player;
                        const wins = checkWinAt(i, player);
                        board[i] = null;
                        if (wins) return i;
                    }
                }
                return -1;
            }

            function checkWinAt(idx, player) {
                const row = Math.floor(idx / size);
                const col = idx % size;
                const win = tttGame.winLength;

                // Direcciones: horizontal, vertical, diagonal, anti-diagonal
                const dirs = [[0,1], [1,0], [1,1], [1,-1]];

                for (let [dr, dc] of dirs) {
                    let count = 1;
                    for (let dir of [1, -1]) {
                        let r = row + dr * dir;
                        let c = col + dc * dir;
                        while (r >= 0 && r < size && c >= 0 && c < size && board[r * size + c] === player) {
                            count++;
                            r += dr * dir;
                            c += dc * dir;
                        }
                    }
                    if (count >= win) return true;
                }
                return false;
            }

            let move = getWinningMove('o');
            if (move === -1) move = getWinningMove('x');
            if (move === -1) {
                const center = Math.floor(size / 2) * size + Math.floor(size / 2);
                if (!board[center]) move = center;
            }
            if (move === -1) {
                const corners = [0, size - 1, size * (size - 1), size * size - 1];
                const available = corners.filter(c => !board[c]);
                if (available.length > 0) move = available[Math.floor(Math.random() * available.length)];
            }
            if (move === -1) {
                const available = board.map((c, i) => c === null ? i : null).filter(i => i !== null);
                if (available.length > 0) move = available[Math.floor(Math.random() * available.length)];
            }

            if (move !== -1) makeTTTMove(move);
        }

        function checkTTTWin() {
            const size = tttGame.size;
            const board = tttGame.board;
            const win = tttGame.winLength;
            const player = tttGame.currentPlayer;

            for (let i = 0; i < board.length; i++) {
                if (board[i] === player) {
                    const row = Math.floor(i / size);
                    const col = i % size;
                    const dirs = [[0,1], [1,0], [1,1], [1,-1]];

                    for (let [dr, dc] of dirs) {
                        let cells = [i];
                        for (let dir of [1, -1]) {
                            let r = row + dr * dir;
                            let c = col + dc * dir;
                            while (r >= 0 && r < size && c >= 0 && c < size && board[r * size + c] === player) {
                                cells.push(r * size + c);
                                r += dr * dir;
                                c += dc * dir;
                            }
                        }
                        if (cells.length >= win) {
                            tttGame.winningCells = cells;
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function highlightWinningCells() {
            if (!tttGame.winningCells) return;

            }
        }

        // ==================== INICIALIZACIÓN ====================
        function initParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = (10 + Math.random() * 10) + 's';
                const colors = ['rgba(0,212,255,0.6)', 'rgba(255,0,255,0.6)', 'rgba(255,105,180,0.6)'];
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                container.appendChild(p);
            }
        }

        function init() {
            GameData.load();
            initParticles();

            // Aplicar configuraciones guardadas
            Object.keys(GameData.data.settings).forEach(key => {
                const toggle = document.getElementById(key + 'Toggle');
                if (toggle) {
                    if (GameData.data.settings[key]) toggle.classList.add('active');
                    else toggle.classList.remove('active');
                }
            });

            AudioSys.musicEnabled = GameData.data.settings.music;
            AudioSys.sfxEnabled = GameData.data.settings.sfx;

            // Prevenir scroll en móviles
            document.addEventListener('touchmove', function(e) {
                if (e.target.closest('.control-btn')) e.preventDefault();
            }, { passive: false });
        }

        // Iniciar
        init();
    </script>
</body>
</html>
